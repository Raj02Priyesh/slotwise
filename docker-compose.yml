# Full stack locally: docker compose up --build  ->  http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: slotwise
      POSTGRES_DB: slotwise
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slotwise']
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://slotwise:slotwise@db:5432/slotwise
      # Local-only secret. Production sets its own SESSION_SECRET.
      SESSION_SECRET: local-docker-compose-secret-change-me-0123456789
    ports:
      - '3000:3000'

volumes:
  pgdata:
